<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제품 링크 모음</title>
<meta name="description" content="영상 속 제품을 번호나 이름으로 검색하세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf9f0; --card: #ffffff; --ink: #1d1d22; --sub: #6b6b75; --line: #e6e4df;
    --accent: #f0266c; --accent-ink: #ffffff; --soft: #ffe8f0; --notice: #fff8dc; --notice-line: #f0dc8a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141417; --card: #1e1e23; --ink: #f2f2f4; --sub: #a0a0ab; --line: #2e2e35;
      --accent: #ff4d8a; --accent-ink: #1f0610; --soft: #2e1720; --notice: #2a2717; --notice-line: #4a4220;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141417; --card: #1e1e23; --ink: #f2f2f4; --sub: #a0a0ab; --line: #2e2e35;
    --accent: #ff4d8a; --accent-ink: #1f0610; --soft: #2e1720; --notice: #2a2717; --notice-line: #4a4220;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 16px 60px; }

  header { text-align: center; }
  .avatar { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 12px; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink); font-size: 34px; font-weight: 800; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  h1 { font-size: 22px; margin: 0 0 6px; font-weight: 800; }
  .bio { color: var(--sub); font-size: 14px; margin: 0 0 14px; line-height: 1.5; }
  .channel { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 600; }
  .channel svg { width: 18px; height: 18px; }

  .notice { margin: 20px 0 16px; padding: 12px 14px; border-radius: 12px; background: var(--notice);
    border: 1px solid var(--notice-line); font-size: 13px; line-height: 1.55; }

  .search { position: sticky; top: 0; z-index: 5; padding: 10px 0; background: var(--bg); }
  .search-box { display: flex; align-items: center; gap: 8px; background: var(--card); border: 2px solid var(--accent);
    border-radius: 14px; padding: 0 14px; }
  .search-box svg { width: 20px; height: 20px; color: var(--sub); flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 16px; padding: 14px 0; }
  .clear { border: 0; background: none; color: var(--sub); font-size: 20px; cursor: pointer; padding: 4px; display: none; }
  .hint { color: var(--sub); font-size: 12.5px; margin: 8px 2px 0; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
    padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .count { color: var(--sub); font-size: 13px; margin: 14px 2px 8px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .item { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 12px; scroll-margin-top: 140px; }
  .item.hit { border-color: var(--accent); box-shadow: 0 0 0 3px var(--soft); }
  .no { flex: none; width: 58px; height: 58px; border-radius: 12px; background: var(--soft); color: var(--accent);
    display: grid; place-items: center; font-weight: 800; font-size: 16px; line-height: 1; text-align: center; }
  .no small { display: block; font-size: 10px; font-weight: 600; margin-top: 3px; }
  .no img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
  .no.thumb { position: relative; width: 84px; height: 84px; background: #fff; border: 1px solid var(--line); }
  .no.thumb .badge { position: absolute; left: -6px; top: -6px; min-width: 34px; padding: 4px 7px; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 800; line-height: 1;
    box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 700; font-size: 15px; margin: 0 0 3px; line-height: 1.35; }
  .meta { color: var(--sub); font-size: 12.5px; margin: 0; line-height: 1.4; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 6px; padding: 2px 6px; margin-right: 4px;
    background: var(--bg); border: 1px solid var(--line); color: var(--sub); }
  .go { flex: none; text-decoration: none; background: var(--accent); color: var(--accent-ink); font-weight: 700;
    font-size: 13.5px; padding: 10px 14px; border-radius: 10px; white-space: nowrap; }
  .go.off { background: var(--line); color: var(--sub); pointer-events: none; }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; display: none; }
  footer { text-align: center; color: var(--sub); font-size: 12px; margin-top: 30px; line-height: 1.6; }
  .theme { border: 1px solid var(--line); background: var(--card); color: var(--sub); border-radius: 999px;
    padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>

  <header>
    <div class="avatar" id="avatar"></div>
    <h1 id="pname"></h1>
    <p class="bio" id="pbio"></p>
    <a class="channel" id="pyt" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="#ff0000" aria-hidden="true"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8z"/><path fill="#fff" d="M9.8 15.1V8.9l5.4 3.1z"/></svg>
      유튜브 채널
    </a>
  </header>

  <div class="notice" id="pnotice"></div>

  <div class="search">
    <label class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" placeholder="영상 번호 또는 제품명 (예: 3, 실링기)" autocomplete="off" aria-label="제품 검색">
      <button class="clear" id="clear" aria-label="검색어 지우기">×</button>
    </label>
    <p class="hint">영상에서 말한 <b>번호</b>를 입력하면 바로 찾아져요.</p>
    <div class="chips" id="chips"></div>
  </div>

  <p class="count" id="count"></p>
  <ul id="list"></ul>
  <p class="empty" id="empty">찾는 제품이 없어요. 번호나 제품명을 다시 확인해 주세요.</p>

  <footer>
    <div>가격·재고·배송 조건은 판매처에서 확인하세요.</div>
    <button class="theme" id="theme">화면 모드 전환</button>
  </footer>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // 프로필
  $("pname").textContent = PROFILE.name;
  $("pbio").textContent = PROFILE.bio;
  $("pnotice").textContent = PROFILE.notice;
  $("pyt").href = PROFILE.youtube;
  document.title = PROFILE.name + " · 제품 링크 모음";
  $("avatar").innerHTML = PROFILE.avatar ? `<img src="${esc(PROFILE.avatar)}" alt="">` : esc(PROFILE.name.trim().charAt(0) || "·");

  const items = [...PRODUCTS].sort((a, b) => b.no - a.no);
  const cats = ["전체", ...new Set(items.map((p) => p.cat).filter(Boolean))];
  let cat = "전체";

  $("chips").innerHTML = cats.map((c) => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join("");
  $("chips").addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    cat = b.dataset.cat;
    document.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", x.dataset.cat === cat));
    render();
  });

  function render() {
    const raw = $("q").value.trim();
    const q = raw.replace(/번$/, "").toLowerCase();
    const isNum = /^\d+$/.test(q);
    $("clear").style.display = raw ? "block" : "none";

    const list = items.filter((p) => {
      if (cat !== "전체" && p.cat !== cat) return false;
      if (!q) return true;
      if (isNum) return String(p.no) === q || String(p.no).startsWith(q);
      return [p.name, p.desc, p.shop, p.cat].join(" ").toLowerCase().includes(q);
    });
    // 번호 정확히 일치하면 맨 위로
    if (isNum) list.sort((a, b) => (String(b.no) === q) - (String(a.no) === q));

    $("list").innerHTML = list.map((p) => {
      const hit = isNum && String(p.no) === q;
      const thumb = p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy"><span class="badge">${p.no}번</span>` : `${p.no}<small>번</small>`;
      const btn = p.link
        ? `<a class="go" href="${esc(p.link)}" target="_blank" rel="noopener sponsored">구매하기</a>`
        : `<span class="go off">준비중</span>`;
      return `<li class="item${hit ? " hit" : ""}" id="p${p.no}">
        <div class="no${p.img ? " thumb" : ""}">${thumb}</div>
        <div class="info">
          <p class="name">${esc(p.name)}</p>
          <p class="meta"><span class="tag">${esc(p.shop)}</span>${esc(p.desc)}</p>
        </div>${btn}</li>`;
    }).join("");
    $("count").textContent = q || cat !== "전체" ? `검색 결과 ${list.length}개` : `전체 ${items.length}개 제품`;
    $("empty").style.display = list.length ? "none" : "block";
  }

  $("q").addEventListener("input", render);
  $("clear").addEventListener("click", (e) => { e.preventDefault(); $("q").value = ""; render(); $("q").focus(); });

  // 주소 끝에 #3 또는 ?q=3 을 붙이면 해당 번호가 바로 검색됨 (고정 댓글용)
  const params = new URLSearchParams(location.search);
  const init = params.get("q") || decodeURIComponent(location.hash.replace(/^#p?/, ""));
  if (init) $("q").value = init;
  render();
  if (init) { const el = document.querySelector(".item.hit"); if (el) el.scrollIntoView({ block: "center" }); }

  // 화면 모드
  const root = document.documentElement;
  try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (e) {}
  $("theme").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  });
})();
</script>
</body>
</html>
